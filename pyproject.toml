[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bannerlord-model-forge"
version = "0.1.0"
description = "Beginner-friendly, non-destructive armour mesh preparation for Mount & Blade II: Bannerlord"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bannerlord Model Forge contributors" }]
dependencies = [
  "numpy>=2.0,<3",
  "Pillow>=11,<13",
  "trimesh>=4.5,<5",
  "fast-simplification>=0.1.12,<1",
  "networkx>=3.4,<4",
  "tkinterdnd2>=0.4.2,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
]

[project.scripts]
bannerlord-model-forge = "bannerlord_model_forge.app:main"
bmf = "bannerlord_model_forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
